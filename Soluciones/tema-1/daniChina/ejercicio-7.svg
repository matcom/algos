<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.2" dur="15.0s" repeatCount="indefinite"/><text x="10" y="82">A</text><rect x="40" y="60" width="46" height="32" fill="#f2f2f2" stroke="#333"/><text x="63.0" y="81" text-anchor="middle">1</text><rect x="92" y="60" width="46" height="32" fill="#f2f2f2" stroke="#333"/><text x="115.0" y="81" text-anchor="middle">4</text><rect x="144" y="60" width="46" height="32" fill="#f2f2f2" stroke="#333"/><text x="167.0" y="81" text-anchor="middle">5</text><rect x="196" y="60" width="46" height="32" fill="#f2f2f2" stroke="#333"/><text x="219.0" y="81" text-anchor="middle">9</text><rect x="248" y="60" width="46" height="32" fill="#f2f2f2" stroke="#333"/><text x="271.0" y="81" text-anchor="middle">12</text><rect x="300" y="60" width="46" height="32" fill="#f2f2f2" stroke="#333"/><text x="323.0" y="81" text-anchor="middle">14</text><text x="10" y="152">B</text><rect x="40" y="130" width="46" height="32" fill="#bdd7ee" stroke="#333"/><text x="63.0" y="151" text-anchor="middle">2</text><rect x="92" y="130" width="46" height="32" fill="#bdd7ee" stroke="#333"/><text x="115.0" y="151" text-anchor="middle">3</text><rect x="144" y="130" width="46" height="32" fill="#bdd7ee" stroke="#333"/><text x="167.0" y="151" text-anchor="middle">7</text><rect x="196" y="130" width="46" height="32" fill="#bdd7ee" stroke="#333"/><text x="219.0" y="151" text-anchor="middle">8</text><rect x="248" y="130" width="46" height="32" fill="#bdd7ee" stroke="#333"/><text x="271.0" y="151" text-anchor="middle">10</text><rect x="300" y="130" width="46" height="32" fill="#bdd7ee" stroke="#333"/><text x="323.0" y="151" text-anchor="middle">15</text><text x="10" y="200">lo = 0, hi = 6</text><text x="10" y="222">Inicio: i* esta en [0, 6]</text><text x="10" y="242" fill="#555">azul: los que se toman con i = mid | naranja: los que se comparan</text></g>
